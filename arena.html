<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>⚔️ DIAMOND CLASH — TikTok LIVE</title>
    <meta name="description" content="Diamond Clash: Batalla épica en tiempo real para TikTok LIVE. ¡Regala para atacar, da likes para curar!" />
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>" />
    <link rel="stylesheet" href="/arena.css?v=300" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700;800&display=swap"
        rel="stylesheet" />
</head>

<body>
    <!-- CONTENEDOR PRINCIPAL MOBILE 9:16 -->
    <div id="mobile-container">

        <!-- Header / Barra Superior -->
        <header id="game-header">
            <div id="timer-box">
                <div id="main-round-timer">03:00</div>
            </div>
            <div id="header-center">
                <div class="game-logo">💎 DIAMOND CLASH</div>
                <div id="cta-banner">
                    <div class="cta-scroll">
                        <span>🎁 REGALA = ATACA ⚡ ❤️ TAP = CURA ⚡ 💬 COMENTA = PODER ⚡ 🦁 LION = MEGABLAST</span>
                        <span>🎁 REGALA = ATACA ⚡ ❤️ TAP = CURA ⚡ 💬 COMENTA = PODER ⚡ 🦁 LION = MEGABLAST</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Podio Top 3 Histórico (JS: updateTopShowcase) -->
        <div id="top-arena-showcase"></div>

        <!-- Anunciador de Eventos -->
        <div id="announcer-container"></div>

        <!-- Frenesí Comunitario -->
        <div id="frenzy-bar-container">
            <div class="frenzy-title">🔥 FRENESÍ 🔥</div>
            <div class="frenzy-track">
                <div id="frenzy-fill"></div>
            </div>
            <div id="frenzy-text">0 / 3000</div>
        </div>

        <!-- Canvas de Juego -->
        <canvas id="gameCanvas"></canvas>

        <!-- Overlays de Estado Especial -->
        <div id="x2-alpha-overlay">
            <h1 class="x2-banner">⚡ MUERTE SÚBITA ⚡</h1>
            <div class="x2-subtitle">¡DAÑO x3!</div>
        </div>

        <div id="golden-minute-overlay">
            <h1 class="x2-banner" style="color:#ffd700; text-shadow:0 0 30px #ffaa00;">✨ MINUTO DE ORO ✨</h1>
            <div class="x2-subtitle" style="border-color:#ffd700; color:#ffd700;">¡PUNTOS x2!</div>
        </div>

        <!-- Leaderboard Lateral -->
        <div id="arena-leaderboard"></div>

        <!-- Ganador de Ronda / Líder Actual (JS: renderLastRoundWinner) -->
        <div id="round-winner-slot"></div>

        <!-- Champions Ticker (JS: champions-ticker) -->
        <div id="champions-ticker" style="display:none;"></div>

        <!-- Guía de Poderes (JS: updatePowersGuide) -->
        <div id="powers-guide"></div>

        <!-- Capa de Textos Flotantes -->
        <div id="floating-ui-layer"></div>

        <!-- Botones de Control -->
        <a href="/overlay" id="switch-btn">🌎 Países</a>
        <button id="sound-btn">🔇 Sonido</button>
    </div>

    <!-- Panel de Debug -->
    <div id="debug-panel" style="display:none; position: fixed; top: 10px; left: 10px; z-index: 10000; background: rgba(0,0,0,0.85); padding: 10px; border: 1px solid #ff4757; border-radius: 8px;">
        <h3 style="color: #ff4757; margin: 0 0 10px 0; font-family: Rajdhani;">MODO DEV</h3>
        <button id="debug-spawn-bot" style="background: #333; color: white; border: 1px solid #666; padding: 5px 10px; cursor: pointer; margin-bottom: 5px; width: 100%;">Spawn Bot</button><br>
        <button id="debug-gift-rose" style="background: #333; color: white; border: 1px solid #666; padding: 5px 10px; cursor: pointer; margin-bottom: 5px; width: 100%;">Ataque Rosa</button><br>
        <button id="debug-gift-galaxy" style="background: #333; color: white; border: 1px solid #666; padding: 5px 10px; cursor: pointer; margin-bottom: 5px; width: 100%;">Ataque Galaxia</button><br>
        <button id="debug-gift-universe" style="background: #333; color: white; border: 1px solid #666; padding: 5px 10px; cursor: pointer; margin-bottom: 5px; width: 100%;">Ataque Dragón</button><br>
        <button id="debug-toggle-sd" style="background: #333; color: white; border: 1px solid #666; padding: 5px 10px; cursor: pointer; width: 100%;">Toggle Muerte Súbita</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/arena.js?v=300"></script>
</body>

</html>
