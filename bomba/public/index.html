<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>💣 LA BOMBA — TikTok LIVE</title>
    <link rel="stylesheet" href="/bomba/style.css?v=2" />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@600;700;800&display=swap"
        rel="stylesheet" />
</head>

<body>
    <!-- Temporizador de ronda -->
    <div id="main-timer">03:00</div>
    <div id="round-label">RONDA EN CURSO</div>

    <!-- Guía rápida -->
    <div id="how-to-play">
        <div class="guide-title">¿CÓMO JUGAR?</div>
        <div class="guide-items">
            <span>💣 La bomba explota en manos de quien la tenga</span>
            <span>🌹 Un regalo la pasa a OTRO jugador y te da puntos</span>
            <span>💬 Escribe <b>PASA</b> en el chat para pasarla</span>
            <span>❤️ 3 taps seguidos = pase automático</span>
        </div>
    </div>

    <!-- Anunciador -->
    <div id="announcer-container"></div>

    <!-- Escena de la bomba -->
    <div id="bomb-scene">
        <div id="bomb-holder">
            <div id="holder-avatar">❓</div>
            <div id="holder-name">ESPERANDO JUGADORES...</div>
            <div id="holder-score">0 pts</div>
        </div>
        <div id="bomb-icon">💣</div>
        <div id="fuse-bar"><div id="fuse-fill"></div></div>
        <div id="fuse-label">MECHA</div>
    </div>

    <!-- Ranking -->
    <div id="ranking-panel">
        <div class="panel-title">🏆 TOP JUGADORES</div>
        <div id="ranking-list"></div>
    </div>

    <!-- Hall of Fame -->
    <div id="hof-panel">
        <div class="panel-title">🏅 HALL OF FAME</div>
        <div id="hof-list"></div>
    </div>

    <!-- FX -->
    <div id="floating-ui-layer"></div>
    <canvas id="fx-canvas"></canvas>

    <div id="status-bar">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Conectando...</span>
    </div>

    <!-- Overlay de ronda -->
    <div id="round-overlay" class="hidden"></div>

    <!-- Botón sonido -->
    <button id="sound-btn">🔊 Activar Sonido</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/bomba/game.js?v=1"></script>
</body>

</html>
