<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎰 TRAGAMONEDAS LIVE — TikTok LIVE</title>
    <link rel="stylesheet" href="/slots/style.css?v=1" />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@600;700;800&display=swap"
        rel="stylesheet" />
</head>

<body>
    <!-- Temporizador -->
    <div id="main-timer">04:00</div>
    <div id="round-label">RONDA EN CURSO</div>

    <!-- Guía rápida -->
    <div id="how-to-play">
        <div class="guide-title">¿CÓMO JUGAR?</div>
        <div class="guide-items">
            <span>🌹 Un regalo de 5+ 💎 jala la palanca</span>
            <span>🎰 2 símbolos iguales pagan x5</span>
            <span>💎 3 iguales = <b>JACKPOT x25</b></span>
            <span>💬 Escribe <b>PALANCA</b> o <b>GIRO</b> para pedirla</span>
        </div>
    </div>

    <!-- Anunciador -->
    <div id="announcer-container"></div>

    <!-- Escena -->
    <div id="scene">
        <div id="machine">
            <div id="machine-top">🎰 TRAGAMONEDAS LIVE 🎰</div>
            <div id="reels">
                <div class="reel" id="reel-0"><span class="reel-symbol">?</span></div>
                <div class="reel" id="reel-1"><span class="reel-symbol">?</span></div>
                <div class="reel" id="reel-2"><span class="reel-symbol">?</span></div>
            </div>
            <div id="jackpot-display">JACKPOT x25 💎</div>
            <div id="lever">🕹️</div>
        </div>
        <div id="stats-row">
            <div class="stat-box"><div class="stat-label">GIROS</div><div class="stat-value" id="stat-spins">0</div></div>
            <div class="stat-box"><div class="stat-label">JACKPOTS</div><div class="stat-value" id="stat-jackpots">0</div></div>
            <div class="stat-box"><div class="stat-label">PREMIOS</div><div class="stat-value" id="stat-total">0</div></div>
        </div>
    </div>

    <!-- Ranking -->
    <div id="ranking-panel">
        <div class="panel-title">🏆 GANADORES</div>
        <div id="ranking-list"></div>
    </div>

    <!-- FX -->
    <div id="floating-ui-layer"></div>
    <canvas id="fx-canvas"></canvas>

    <div id="status-bar">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Conectando...</span>
    </div>

    <!-- Overlay -->
    <div id="round-overlay" class="hidden"></div>

    <!-- Botón sonido -->
    <button id="sound-btn">🔊 Activar Sonido</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/slots/game.js?v=1"></script>
</body>

</html>
