<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🏆 SUBASTA REAL — TikTok LIVE</title>
    <link rel="stylesheet" href="/subasta/style.css?v=1" />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@600;700;800&display=swap"
        rel="stylesheet" />
</head>

<body>
    <!-- Temporizador -->
    <div id="main-timer">03:00</div>
    <div id="round-label">SUBASTA #1</div>

    <!-- Guía rápida -->
    <div id="how-to-play">
        <div class="guide-title">¿CÓMO JUGAR?</div>
        <div class="guide-items">
            <span>🎁 Hay un premio en juego</span>
            <span>🌹 Manda regalos para pujar (1 💎 = 1 punto)</span>
            <span>👑 El mayor pujador cuando termine el tiempo GANA</span>
            <span>💬 Escribe <b>PUJA</b> o <b>SUBIDO</b> para calentar la puja</span>
        </div>
    </div>

    <!-- Anunciador -->
    <div id="announcer-container"></div>

    <!-- Escena -->
    <div id="scene">
        <div id="prize-box">
            <div id="prize-emoji">👑</div>
            <div id="prize-name">— PREMIO EN JUEGO —</div>
            <div id="prize-value"></div>
        </div>
        <div id="phase-banner" class="hidden">⏰ ¡ÚLTIMOS 15 SEGUNDOS! ⏰</div>
        <div id="bids-panel">
            <div class="panel-title">🛎️ PUJAS ACTUALES</div>
            <div id="bids-list"></div>
        </div>
    </div>

    <!-- FX -->
    <div id="floating-ui-layer"></div>
    <canvas id="fx-canvas"></canvas>

    <div id="status-bar">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Conectando...</span>
    </div>

    <!-- Overlay -->
    <div id="round-overlay" class="hidden"></div>

    <!-- Botón sonido -->
    <button id="sound-btn">🔊 Activar Sonido</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/subasta/game.js?v=1"></script>
</body>

</html>
